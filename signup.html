<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup - SkillConnect</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
}

.container{
    background:white;
    width:450px;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1{
    color:#2563eb;
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:gray;
    margin-bottom:20px;
}

label{
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.bottom-text{
    text-align:center;
    margin-top:20px;
}

.bottom-text a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h1>Create Account</h1>

<p>Join SkillConnect Today 🚀</p>

<form id="signupForm">

    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Enter your full name"
           autocomplete="name" required>

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter your email"
           autocomplete="email" required>

    <label>Password</label>
    <input type="password" id="password" placeholder="Create a password"
           autocomplete="new-password" minlength="8" required>

    <label>City</label>
    <input type="text" id="city" placeholder="Enter your city" required>

    <label>Skills You Can Teach</label>
    <input type="text" id="skillsTeach"
           placeholder="Example: HTML, Python">

    <label>Skills You Want to Learn</label>
    <input type="text" id="skillsLearn"
           placeholder="Example: Photoshop, Java">

    <label>Short Bio</label>
    <textarea id="bio" rows="4"
              placeholder="Tell others about yourself"></textarea>

    <p id="signupMessage" role="status" aria-live="polite"></p>

    <button type="submit" id="signupButton">Create Account</button>

</form>


<div class="bottom-text">
<div class="bottom-text">
Already have an account?
<a href="login.html">Login</a>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="jss/supabase.js"></script>
<script src="jss/signup.js"></script>

</body>
</html>
