<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SkillConnect</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    background:#eef2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:350px;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1{
    color:#2563eb;
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:gray;
    margin-bottom:20px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.bottom-text{
    margin-top:20px;
    text-align:center;
}

.bottom-text a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>SkillConnect</h1>

<p>Welcome Back 👋</p>


<form id="loginForm">

    <label>Email</label>
    <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
    >

    <label>Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
    >

    <p id="loginMessage" role="status" aria-live="polite"></p>

    <button type="submit" id="loginButton">Login</button>

</form>


<div class="bottom-text">
Don't have an account?
<a href="signup.html">Create Account</a>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="jss/supabase.js"></script>
<script src="jss/login.js"></script>

</body>
</html>
